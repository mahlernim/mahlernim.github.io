<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ author.name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ author.affiliation }}의 연구, 논문, 강의 영상 및 연구 도구{% endblock %}">
  <meta name="google-adsense-account" content="ca-pub-4628399954212784">
  <link rel="canonical" href="{% block canonical %}{{ base_url }}/{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ self.title()|striptags }}">
  <meta property="og:description" content="{{ self.description()|striptags }}">
  <meta property="og:url" content="{{ self.canonical()|striptags }}">
  <link rel="stylesheet" href="/static/css/style.css">
  {% block structured_data %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#content">본문으로 이동</a>
  <header class="site-header">
    <nav class="nav container" aria-label="주요 메뉴">
      <a class="brand" href="/">Ahn Lab</a>
      <div class="nav-links">
        <a {% if page == 'videos' %}aria-current="page"{% endif %} href="/videos/">영상</a>
        <a {% if page == 'publications' %}aria-current="page"{% endif %} href="/publications/">논문</a>
        <a {% if page == 'projects' %}aria-current="page"{% endif %} href="/projects/">프로젝트</a>
      </div>
    </nav>
  </header>
  <main id="content" class="container">{% block content %}{% endblock %}</main>
  <footer><div class="container">© {{ build_year }} {{ author.name }}</div></footer>
</body>
</html>
