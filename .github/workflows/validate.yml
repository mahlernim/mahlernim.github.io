name: Validate academic hub

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python build.py --offline
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ttokttok
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/ttokttok/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify published assets match source
        run: |
          git diff --exit-code -- ../../ttokttok/app
          test -z "$(git ls-files --others --exclude-standard -- ../../ttokttok/app)"
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
