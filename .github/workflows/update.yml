name: Hydrogen live test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt
      - name: Test one affected video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from scripts.fetch_youtube import fetch_gemini_video_evidence
          import sys, re, os
          def trace(frame,event,arg):
              if frame.f_code is fetch_gemini_video_evidence.__code__ and event=='exception':
                  exc=arg[1]
                  message=str(exc).replace(os.environ['GEMINI_API_KEY'],'[redacted]')
                  print('Provider diagnostic:', re.sub(r'AIza[\w-]+','[redacted]',message)[:800])
              return trace
          sys.settrace(trace)
          notes, meta=fetch_gemini_video_evidence('n_2cfdt8j3A')
          sys.settrace(None)
          print(meta, 'Evidence characters:',len(notes))
          raise SystemExit(0 if notes else 1)
          PY
