name: Update academic hub

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Content generation mode
        required: true
        default: acceptance
        type: choice
        options:
          - acceptance
          - daily
          - backfill
          - posts
      effort:
        description: Reasoning effort
        required: true
        default: medium
        type: choice
        options:
          - medium
          - low

concurrency:
  group: academic-hub-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Generate and save the oldest pending video summary
        run: |
          python - <<'PY'
          from scripts import generate_summaries as g
          video_id = 'V0UvWF3Oo_k'
          prior = g.load_json(g.CONTENT, {})['items']['video:' + video_id]
          assert prior['status'] == 'pending_source'
          approved = g.load_json(g.ROOT / 'prompts/approval.json', {})
          assert approved['approved']
          g.needs_generation = lambda existing, item: item.get('video_id') == video_id
          g.run('daily', approved['reasoning_effort'])
          result = g.load_json(g.CONTENT, {})['items']['video:' + video_id]
          assert result['status'] == 'ready', result['status']
          PY
      - name: Build static pages
        run: python build.py --offline
      - name: Validate
        run: python -m pytest -q
      - name: Commit production output
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.mode != 'acceptance')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos_cache.json data/publications_cache.json _pipeline/generated_content.json _pipeline/wordpress_sources.json _pipeline/posts.json index.html posts videos publications projects sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update academic hub content"
            git push
          fi
